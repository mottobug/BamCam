name: pages

# Publishes the project website (site/ plus the screenshots and the icon) to GitHub Pages.
on:
  push:
    branches: [main]
    paths: ["site/**", "docs/screenshots/**", "src/BamCam.App/Assets/bamcam.png", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - name: Assemble site
        run: |
          mkdir -p _site/screenshots
          cp -r site/. _site/
          cp docs/screenshots/*.png _site/screenshots/
          cp src/BamCam.App/Assets/bamcam.png _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
