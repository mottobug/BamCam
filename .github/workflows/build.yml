name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"
      - name: Build
        run: dotnet build -c Release
      # Community plugins are not in the solution: each is built on its own, so that a pull request shows whether it builds.
      - name: Build community plugins
        shell: pwsh
        run: |
          foreach ($project in Get-ChildItem plugins/community -Filter *.csproj -Recurse) {
            dotnet build $project.FullName -c Release
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }
      # Tests that compare against a local CamBam installation pass trivially here (no installation on CI).
      - name: Test
        run: dotnet test -c Release --no-build --logger "trx;LogFileName=results.trx"
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.os }}
          path: "**/TestResults/*.trx"

  package:
    name: package (${{ matrix.name }})
    needs: test
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: win-x64, rids: "win-x64", os: windows-latest }
          - { name: linux, rids: "linux-x64 linux-arm64", os: ubuntu-latest }
          # Both Mac builds on one runner: hosted macOS runners are scarce and a job can wait long for one.
          - { name: macos, rids: "osx-x64 osx-arm64", os: macos-latest }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"
      - name: Version
        id: version
        shell: pwsh
        run: |
          $v = if ("${{ github.ref_type }}" -eq "tag") { "${{ github.ref_name }}".TrimStart("v") } else { "0.0.0-ci.${{ github.run_number }}" }
          "version=$v" >> $env:GITHUB_OUTPUT
      # AppImages (issue 41): appimagetool and the AppImage runtimes from the AppImage project, at fixed versions and
      # checksums. Files of a release can be replaced under the same tag: a changed file stops the build instead of
      # going into the AppImages. For another version, update the URLs and the checksums together.
      - name: AppImage tools
        if: matrix.name == 'linux'
        run: |
          mkdir -p "$RUNNER_TEMP/appimage"
          cd "$RUNNER_TEMP/appimage"
          curl -fsSL -o appimagetool https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
          for arch in x86_64 aarch64; do
            curl -fsSL -o runtime-$arch https://github.com/AppImage/type2-runtime/releases/download/20251108/runtime-$arch
          done
          sha256sum --check --strict <<'EOF'
          ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0  appimagetool
          2fca8b443c92510f1483a883f60061ad09b46b978b2631c807cd873a47ec260d  runtime-x86_64
          00cbdfcf917cc6c0ff6d3347d59e0ca1f7f45a6df1a428a0d6d8a78664d87444  runtime-aarch64
          EOF
          chmod +x appimagetool
      # .rpm packages: rpmbuild from Ubuntu's own package sources (dpkg-deb for the .deb packages is there already).
      - name: rpmbuild
        if: matrix.name == 'linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends rpm
      - name: Package
        shell: pwsh
        run: |
          foreach ($rid in "${{ matrix.rids }}".Split(" ")) {
            $extra = @{}
            if ($rid -like "linux-*") {
              $arch = if ($rid -like "*arm64") { "aarch64" } else { "x86_64" }
              $extra = @{ AppImageTool = "$env:RUNNER_TEMP/appimage/appimagetool"; AppImageRuntime = "$env:RUNNER_TEMP/appimage/runtime-$arch" }
            }
            ./build/package.ps1 -Rid $rid -Version ${{ steps.version.outputs.version }} @extra
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }
      # The x64 .deb must install with its dependencies; the .rpm packages must hold the files.
      - name: Check Linux packages
        if: matrix.name == 'linux'
        run: |
          sudo apt-get install -y ./artifacts/BamCam-*-linux-x64.deb
          test -x /usr/lib/bamcam/BamCam && test -L /usr/bin/bamcam && test -f /usr/share/applications/bamcam.desktop
          sudo apt-get remove -y bamcam
          for rpm in artifacts/*.rpm; do rpm -qip "$rpm"; rpm -qlp "$rpm" | grep -qx /usr/lib/bamcam/BamCam; done
      - name: NuGet packages for plugin authors
        if: matrix.name == 'win-x64'
        shell: pwsh
        run: |
          foreach ($project in "src/BamCam.Core", "src/BamCam.PluginApi") {
            dotnet pack $project -c Release -p:Version=${{ steps.version.outputs.version }} -o artifacts
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }
      # Each community plugin as its own ZIP (community-<Author>.<Name>-<version>.zip), so that GitHub counts its downloads.
      - name: Community plugins
        if: matrix.name == 'win-x64'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          foreach ($folder in Get-ChildItem plugins/community -Directory | Where-Object { -not $_.Name.StartsWith("_") }) {
            $project = Get-ChildItem $folder.FullName -Filter *.csproj | Select-Object -First 1
            if (-not $project) { continue }
            $out = Join-Path $env:RUNNER_TEMP "community/$($folder.Name)"
            dotnet build $project.FullName -c Release -o $out
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
            $version = ([xml](Get-Content $project.FullName)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
            if (-not $version) { $version = "1.0.0" }
            # BamCam's own assemblies come with BamCam.
            Get-ChildItem $out -Filter "BamCam.*" | Where-Object { $_.Name -notlike "$($folder.Name)*" } | Remove-Item
            Copy-Item (Join-Path $folder.FullName "README.md") $out -ErrorAction SilentlyContinue
            Compress-Archive -Path "$out/*" -DestinationPath "artifacts/community-$($folder.Name)-$version.zip" -Force
          }
      - uses: actions/upload-artifact@v7
        with:
          name: BamCam-${{ matrix.name }}
          path: |
            artifacts/*.zip
            artifacts/*.tar.gz
            artifacts/*.AppImage
            artifacts/*.deb
            artifacts/*.rpm
            artifacts/*-setup.exe
            artifacts/*.nupkg
          if-no-files-found: error

  release:
    name: release
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          # Only the packages, not the test results.
          pattern: BamCam-*
          path: dist
          merge-multiple: true
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        # Tags with a suffix (v0.8.0-beta.1) become pre-releases: the update check offers them only on request.
        run: |
          flags=""
          if [[ "${{ github.ref_name }}" == *-* ]]; then flags="--prerelease"; fi
          gh release create "${{ github.ref_name }}" dist/* --repo "${{ github.repository }}" --title "BamCam ${{ github.ref_name }}" --generate-notes $flags
