name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"
      - name: Build
        run: dotnet build -c Release
      # Tests that compare against a local CamBam installation pass trivially here (no installation on CI).
      - name: Test
        run: dotnet test -c Release --no-build --logger "trx;LogFileName=results.trx"
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.os }}
          path: "**/TestResults/*.trx"

  package:
    name: package (${{ matrix.name }})
    needs: test
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: win-x64, rids: "win-x64", os: windows-latest }
          - { name: linux, rids: "linux-x64 linux-arm64", os: ubuntu-latest }
          # Both Mac builds on one runner: hosted macOS runners are scarce and a job can wait long for one.
          - { name: macos, rids: "osx-x64 osx-arm64", os: macos-latest }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"
      - name: Version
        id: version
        shell: pwsh
        run: |
          $v = if ("${{ github.ref_type }}" -eq "tag") { "${{ github.ref_name }}".TrimStart("v") } else { "0.0.0-ci.${{ github.run_number }}" }
          "version=$v" >> $env:GITHUB_OUTPUT
      - name: Package
        shell: pwsh
        run: |
          foreach ($rid in "${{ matrix.rids }}".Split(" ")) {
            ./build/package.ps1 -Rid $rid -Version ${{ steps.version.outputs.version }}
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }
      - name: NuGet packages for plugin authors
        if: matrix.name == 'win-x64'
        shell: pwsh
        run: |
          foreach ($project in "src/BamCam.Core", "src/BamCam.PluginApi") {
            dotnet pack $project -c Release -p:Version=${{ steps.version.outputs.version }} -o artifacts
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }
      - uses: actions/upload-artifact@v7
        with:
          name: BamCam-${{ matrix.name }}
          path: |
            artifacts/*.zip
            artifacts/*.tar.gz
            artifacts/*-setup.exe
            artifacts/*.nupkg
          if-no-files-found: error

  release:
    name: release
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          # Only the packages, not the test results.
          pattern: BamCam-*
          path: dist
          merge-multiple: true
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        # Tags with a suffix (v0.8.0-beta.1) become pre-releases: the update check offers them only on request.
        run: |
          flags=""
          if [[ "${{ github.ref_name }}" == *-* ]]; then flags="--prerelease"; fi
          gh release create "${{ github.ref_name }}" dist/* --repo "${{ github.repository }}" --title "BamCam ${{ github.ref_name }}" --generate-notes $flags
