<?xml version="1.0" encoding="UTF-8"?>
<!-- Test drawing for the SVG import: an A6 page (148 x 105 mm) with Inkscape layers. -->
<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink"
     xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
     xmlns:sodipodi="http://sodipodi.sourceforge.net/DTD/sodipodi-0.dtd"
     width="148mm" height="105mm" viewBox="0 0 148 105">
  <sodipodi:namedview id="namedview1" inkscape:document-units="mm"/>
  <defs>
    <circle id="hole" r="2"/>
  </defs>
  <g inkscape:groupmode="layer" inkscape:label="Outline" id="layer1">
    <!-- Plate with rounded corners. -->
    <rect x="10" y="10" width="128" height="85" rx="6" style="fill:none;stroke:#000000;stroke-width:0.3"/>
  </g>
  <g inkscape:groupmode="layer" inkscape:label="Holes" id="layer2">
    <use xlink:href="#hole" x="20" y="20"/>
    <use xlink:href="#hole" x="128" y="20"/>
    <use xlink:href="#hole" x="20" y="85"/>
    <use xlink:href="#hole" x="128" y="85"/>
  </g>
  <g inkscape:groupmode="layer" inkscape:label="Pockets" id="layer3">
    <!-- Heart of cubic curves. -->
    <path d="M 45,45 C 45,37 33,33 30,42 C 27,51 38,58 45,66 C 52,58 63,51 60,42 C 57,33 45,37 45,45 Z"
          style="fill:none;stroke:#ff0000;stroke-width:0.3"/>
    <!-- Slot with two half circles (arc commands). -->
    <path d="m 80,40 h 30 a 6,6 0 0 1 0,12 h -30 a 6,6 0 0 1 0,-12 z" style="fill:none;stroke:#ff0000;stroke-width:0.3"/>
    <!-- Ellipse, rotated. -->
    <ellipse cx="95" cy="72" rx="15" ry="7" transform="rotate(-15 95 72)" style="fill:none;stroke:#ff0000;stroke-width:0.3"/>
  </g>
  <g inkscape:groupmode="layer" inkscape:label="Engrave" id="layer4">
    <!-- Wave with quadratic curves. -->
    <path d="M 25,30 Q 30,24 35,30 T 45,30 T 55,30 T 65,30" style="fill:none;stroke:#0000ff;stroke-width:0.3"/>
    <!-- Text is skipped with a message: convert it to paths in Inkscape first. -->
    <text x="70" y="30" style="font-size:6px">BamCam</text>
  </g>
  <g inkscape:groupmode="layer" inkscape:label="Notes (hidden)" id="layer5" style="display:none">
    <rect x="0" y="0" width="148" height="105"/>
  </g>
</svg>
